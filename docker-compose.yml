version: '3.7'

services:
  nginx:
    image: nginx:latest
    container_name: ng01
    ports:
      - 80:80
    volumes:
      - ./src:/src
      - ./config:/etc/nginx/conf.d
    depends_on:
      - web

  web:
    container_name: log1
    build: .
    volumes:
      - ./:/usr/src/log1/
    ports:
      - 8000:8000
    env_file:
      - ./.env
