version: '3.7'

services:
  nginx:
    image: nginx:latest
    container_name: ng01
    ports:
      - 80:80
    volumes:
      - ./config/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - web
    networks:
      - nginx_network

  djangoapp:
    container_name: log1_v2
    build: .
    volumes:
      - ./:/usr/src/log1/
    ports:
      - 8001:8001
    env_file:
      - ./.env
    networks:
      - nginx_network

networks:
  nginx_network:
    driver: bridge