version: '3.7'

services:
  db:
    container_name: db
    image: postgres:12.0-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=projectx
      - POSTGRES_PASSWORD=consultadd
      - POSTGRES_DB=log1_db

  web:
    container_name: log1
    build: .
    volumes:
      - ./:/usr/src/log1/
    ports:
      - 8000:8000
    depends_on:
      - db
    env_file:
      - ./.env

volumes:
  postgres_data: