name: CI-Log1-Backend-Staging

on:
  push:
    branches:
      - 'master'
      - 'staging'

jobs:
  production-deploy:
    if: startsWith(github.ref, 'refs/heads/master')  # Only run for main branch
    runs-on: [log1-backend-prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.8.10

      - name: Copy to project directory
        run: sudo cp -R . /home/ubuntu/log1

      - name: Change directory
        run: | 
         cd /home/ubuntu/log1
          source ../env/bin/activate
          python -m pip install --upgrade pip==23.0.1 
          pip install -r requirements.txt
          python manage.py makemigrations
          python manage.py migrate
          sudo chmod -R a+rwx /home/ubuntu/log1
          sudo chmod a+rwx /home/ubuntu/log1/logs/address.log
          sudo chmod a+rwx /home/ubuntu/log1/logs/error.log
          sudo chmod -R a+rwx /home/ubuntu/log1/media/

      - name: Run Test
        run: |
          echo "Run Test Cases"
          cd /home/ubuntu/log1
#          python manage.py test

      - name: Deploy to Log1 Server
        run: |
          echo "Deploying to Log1 Server"
          cd /home/ubuntu/log1
          sudo systemctl restart gunicorn

  staging-deploy:
    if: startsWith(github.ref, 'refs/heads/staging')  # Only run for staging branch
    runs-on: [log1-backend-staging]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.8.10

      - name: Copy to project directory
        run: sudo cp -R . /home/ubuntu/Log1

      - name: Change directory
        run: | 
         cd /home/ubuntu/Log1
          source ../env/bin/activate
          python -m pip install --upgrade pip==23.0.1 
          pip install -r requirements.txt
          python manage.py makemigrations
          python manage.py migrate
          sudo chmod -R a+rwx /home/ubuntu/Log1
          sudo chmod a+rwx /home/ubuntu/Log1/logs/address.log
          sudo chmod a+rwx /home/ubuntu/Log1/logs/error.log
          sudo chmod -R a+rwx /home/ubuntu/Log1/media/

      - name: Run Test
        run: |
          echo "Run Test Cases"
          cd /home/ubuntu/Log1
  #          python manage.py test

      - name: Deploy to Log1 Server
        run: |
          echo "Deploying to Log1 Server"
          cd /home/ubuntu/Log1
          sudo systemctl restart gunicorn
