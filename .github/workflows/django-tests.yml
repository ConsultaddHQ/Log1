name: Django test suite

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: log1_test
          POSTGRES_USER: log1
          POSTGRES_PASSWORD: log1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U log1 -d log1_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare runtime directories and migrations
        env:
          SECRET_KEY: django-test-only-secret
          DB_NAME: log1_test
          DB_USER: log1
          DB_PASSWORD: log1
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          ENV: local
          FCM_SERVER_KEY: ci-dummy-fcm-key
        run: |
          mkdir -p logs media
          python - <<'PY'
          import os
          import subprocess
          import sys

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "log1.settings")
          import django

          django.setup()
          from django.apps import apps

          for config in apps.get_app_configs():
              subprocess.run(
                  [sys.executable, "manage.py", "makemigrations", config.label, "--noinput"],
                  check=True,
              )
          PY

      - name: Run Django checks
        env:
          SECRET_KEY: django-test-only-secret
          DB_NAME: log1_test
          DB_USER: log1
          DB_PASSWORD: log1
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          ENV: local
          FCM_SERVER_KEY: ci-dummy-fcm-key
        run: python manage.py check

      - name: Run Django test suite
        env:
          SECRET_KEY: django-test-only-secret
          DB_NAME: log1_test
          DB_USER: log1
          DB_PASSWORD: log1
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          ENV: local
          FCM_SERVER_KEY: ci-dummy-fcm-key
        run: python manage.py test --noinput
