upstream log1app {
    server web_app:5000;
}

server {

    listen 80;
    access_log off;
    location /api/ {
        proxy_pass http://log1app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        client_max_body_size 100M;
    }

    location /static/ {
        alias /home/app/web/static/;
    }

}